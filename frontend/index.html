<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDCL Task Manager</title>
    <meta name="description" content="Enterprise Task and Team Management System with KPI, analytics, and audit logging." />
    <meta property="og:title" content="PDCL Task Manager" />
    <meta property="og:description" content="Enterprise Task and Team Management System with KPI, analytics, and audit logging." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var dark = null;
          try {
            var saved = localStorage.getItem('pdcl_ict_theme');
            if (saved) dark = saved === 'dark';
          } catch (e) {}
          if (dark === null && window.matchMedia) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          root.classList.toggle('dark', !!dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
